name: Temporary iPad screenshot capture

on:
  push:
    branches:
      - fix/mobile-ipad-compatibility

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download the iOS simulator build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ipad-screenshot-temp-20260813 --repo "$GITHUB_REPOSITORY" --pattern lyra-simulator-build32.tar.gz
          mkdir extracted
          tar -xzf lyra-simulator-build32.tar.gz -C extracted
          app_path="$(find extracted -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Boot a 13-inch iPad simulator
        run: |
          runtime_id="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); choices=[x for x in data["runtimes"] if x.get("isAvailable") and x.get("platform")=="iOS"]; print(sorted(choices,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')"
          device_type_id="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; data=json.load(sys.stdin); choices=[x for x in data["devicetypes"] if "iPad Pro 13-inch" in x["name"]]; print(choices[-1]["identifier"])')"
          test -n "$runtime_id"
          test -n "$device_type_id"
          device_id="$(xcrun simctl create 'Lyra App Store iPad' "$device_type_id" "$runtime_id")"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b

      - name: Install, launch, and capture the app
        run: |
          xcrun simctl spawn "$DEVICE_ID" defaults write NSGlobalDomain AppleLanguages -array ja
          xcrun simctl spawn "$DEVICE_ID" defaults write NSGlobalDomain AppleLocale ja_JP
          xcrun simctl status_bar "$DEVICE_ID" override --time 09:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" jp.lyra.mobile
          sleep 15
          mkdir ipad-screenshots
          xcrun simctl io "$DEVICE_ID" screenshot ipad-screenshots/lyra-ipad-13-portrait.png
          dimensions="$(sips -g pixelWidth -g pixelHeight ipad-screenshots/lyra-ipad-13-portrait.png)"
          echo "$dimensions"
          echo "$dimensions" | grep -q 'pixelWidth: 2064'
          echo "$dimensions" | grep -q 'pixelHeight: 2752'

      - name: Upload the screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyra-ipad-13-screenshot
          path: ipad-screenshots/lyra-ipad-13-portrait.png
          if-no-files-found: error
