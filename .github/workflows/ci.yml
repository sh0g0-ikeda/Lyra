name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lyra_test
      DATABASE_SSL_MODE: disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lyra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Run Vitest suite
        run: bun run test

      - name: Run Bun test entrypoint
        run: bun test

      - name: Apply migrations to PostgreSQL
        run: bun run migrate

      - name: Verify PostgreSQL deployment invariants
        run: bun run db:check-invariants

      - name: Build backend
        run: bun run build

      - name: Lint frontend
        run: npm --prefix apps/web run lint

      - name: Build frontend
        run: npm --prefix apps/web run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm --prefix apps/web run e2e

  mobile-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Verify generated API contract
        run: npm run mobile:contracts:check

      - name: Verify Expo dependencies
        run: npm --prefix apps/mobile run expo:check

      - name: Diagnose Expo project
        run: npm --prefix apps/mobile run doctor

      - name: Typecheck Mobile
        run: npm run mobile:typecheck

      - name: Lint Mobile
        run: npm run mobile:lint

      - name: Test Mobile
        run: npm run mobile:test

      - name: Export Android bundle
        run: npm run mobile:export:android

      - name: Export iOS bundle
        run: npm run mobile:export:ios
