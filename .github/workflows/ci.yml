name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # Keep browser dependency installation reproducible across runner-image rollouts.
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lyra_test
      DATABASE_SSL_MODE: disable
      LYRA_CI_TEST_DATABASE_ADMIN_ALLOWED: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lyra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-production-version:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: lyra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Run Vitest suite
        run: >-
          bun run test --exclude tests/integration/expandedReleaseCompatibility.test.ts
          --exclude tests/integration/production44ExpandedPersistence.test.ts
          --exclude tests/integration/production44Expansion.test.ts
          --exclude tests/integration/production44PersistenceProfile.test.ts
          --exclude tests/integration/production44TerminalNotificationRecovery.test.ts
          --exclude tests/integration/googleIdentityRecoveryAttestation.test.ts

      - name: Run release DB regressions on production PostgreSQL version
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/lyra_test
        run: bun run test tests/integration

      - name: Run Bun test entrypoint
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/lyra_test
        run: bun test --isolate

      - name: Verify Backend API inventory
        run: npm run api:inventory:check

      - name: Apply migrations to PostgreSQL
        run: bun run migrate

      - name: Verify PostgreSQL deployment invariants
        run: bun run db:check-invariants

      - name: Build backend
        run: bun run build

      - name: Lint frontend
        run: npm --prefix apps/web run lint

      - name: Build frontend
        run: npm --prefix apps/web run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm --prefix apps/web run e2e

  mobile-verify:
    # Keep browser dependency installation reproducible across runner-image rollouts.
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The 1.0.11 OTA lane compares native inputs with the shipped commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Verify generated API contract
        run: npm run mobile:contracts:check

      - name: Verify Expo dependencies
        if: >-
          github.event_name != 'pull_request' ||
          github.head_ref != 'fix/mobile-1-0-11-sunburst-ota' ||
          github.base_ref != 'release/mobile-1-0-11-base'
        run: npm --prefix apps/mobile run expo:check

      - name: Verify shipped 1.0.11 native dependency lock
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'fix/mobile-1-0-11-sunburst-ota' &&
          github.base_ref == 'release/mobile-1-0-11-base'
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
          SHIPPED_MOBILE_COMMIT: 88737aa8b6be50bf601e00541da831b5524cf0a6
        shell: bash
        run: |
          # Validate against the Expo native-module map installed by the frozen lockfile,
          # rather than newer patch recommendations fetched from the registry.
          npm --prefix apps/mobile run expo:check

          # OTA JavaScript must retain the exact dependencies and dynamic native config
          # used by the shipped 1.0.11 binary.
          git diff --exit-code "$SHIPPED_MOBILE_COMMIT" -- \
            apps/mobile/package.json \
            apps/mobile/package-lock.json \
            apps/mobile/app.config.js \
            apps/mobile/eas.json \
            apps/mobile/assets/icon.png \
            apps/mobile/assets/splash.png \
            apps/mobile/assets/adaptive-icon.png

          # `platforms` only limits this OTA export to the shipped native targets. It is
          # not native configuration; every other app.json value must match 1.0.11.
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');

          const shippedCommit = process.env.SHIPPED_MOBILE_COMMIT;
          const shipped = JSON.parse(execFileSync(
            'git',
            ['show', `${shippedCommit}:apps/mobile/app.json`],
            { encoding: 'utf8' },
          ));
          const candidate = JSON.parse(readFileSync('apps/mobile/app.json', 'utf8'));
          const candidatePlatforms = candidate.expo?.platforms;
          delete candidate.expo.platforms;

          if (JSON.stringify(candidate) !== JSON.stringify(shipped)) {
            throw new Error('OTA candidate changes shipped native app configuration');
          }
          if (JSON.stringify(candidatePlatforms) !== JSON.stringify(['ios', 'android'])) {
            throw new Error('OTA candidate platforms must be exactly ios and android');
          }
          NODE

      - name: Diagnose Expo project
        if: >-
          github.event_name != 'pull_request' ||
          github.head_ref != 'fix/mobile-1-0-11-sunburst-ota' ||
          github.base_ref != 'release/mobile-1-0-11-base'
        run: npm --prefix apps/mobile run doctor

      - name: Diagnose Expo project with shipped dependency lock
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'fix/mobile-1-0-11-sunburst-ota' &&
          github.base_ref == 'release/mobile-1-0-11-base'
        env:
          # Dependency compatibility was fail-closed against the shipped lock above;
          # keep every other Expo Doctor diagnostic without consulting newer patches.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: npm --prefix apps/mobile run doctor

      - name: Typecheck Mobile
        run: npm run mobile:typecheck

      - name: Lint Mobile
        run: npm run mobile:lint

      - name: Test Mobile
        run: npm run mobile:test

      - name: Export Android bundle
        run: npm run mobile:export:android

      - name: Export iOS bundle
        run: npm run mobile:export:ios
