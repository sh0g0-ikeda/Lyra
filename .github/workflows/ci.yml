name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lyra_test
      DATABASE_SSL_MODE: disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lyra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Verify generated Mobile API contracts
        run: bun run mobile:contracts:check

      - name: Verify Mobile API method inventory
        run: bun run mobile:api-inventory:check

      - name: Verify Mobile Web parity inventory
        run: bun run mobile:web-parity:check

      - name: Run Vitest suite
        run: bun run test

      - name: Run Bun test entrypoint
        run: >-
          bun test
          tests/unit/lib/migrations.test.ts
          tests/unit/ops/Dockerfile.test.ts
          tests/unit/scripts/mobileApiBidirectionalAudit.test.ts

      - name: Apply migrations to PostgreSQL
        run: bun run migrate

      - name: Verify PostgreSQL deployment invariants
        run: bun run db:check-invariants

      - name: Build backend
        run: bun run build

      - name: Lint frontend
        run: npm --prefix apps/web run lint

      - name: Build frontend
        run: npm --prefix apps/web run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm --prefix apps/web run e2e

  mobile-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile dependencies
        run: npm ci

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Diagnose Expo project
        run: npx expo-doctor

      - name: Verify generated API contracts
        run: npm run contracts:check

      - name: Check Mobile types
        run: npm run typecheck

      - name: Lint Mobile
        run: npm run lint

      - name: Test Mobile
        run: npm test

      - name: Check Japanese source encoding
        run: npm run check:mojibake

      - name: Export Android bundle
        run: npm run export:android

      - name: Export iOS bundle
        run: npm run export:ios
