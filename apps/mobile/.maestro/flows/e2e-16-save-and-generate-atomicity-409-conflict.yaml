appId: ${APP_ID}
name: "E2E-16: quoted generation/409 conflict"
tags: [staging, page, conflict]
---
- runFlow:
    file: ../helpers/launch-authenticated.yaml
- runFlow:
    file: ../helpers/open-pages.yaml
- tapOn: ${E2E_CONFLICT_PAGE_LABEL}
- tapOn:
    id: page-step-create
- tapOn: ${E2E_SAVE_AND_GENERATE_LABEL}
- runFlow:
    file: ../helpers/accept-page-quote.yaml
- extendedWaitUntil:
    visible: ${E2E_CONFLICT_LABEL}
    timeout: 45000
- tapOn: ${E2E_CONFLICT_RESOLUTION_LABEL}
- takeScreenshot: E2E-16-conflict-recovery
